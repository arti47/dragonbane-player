<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6e1f14" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preload" href="fonts/eb-garamond.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/im-fell-english-sc.woff2" as="font" type="font/woff2" crossorigin />
  <script>try{var m=localStorage.getItem("dragonbane.theme")||"system";document.documentElement.setAttribute("data-theme",m==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):m);}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
  <title>Dragonbane Player</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="brand"><span class="brand-emb"><svg class="drake" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="29" class="dk-ring"/><g transform="translate(3 1) scale(.92)"><path class="dk-head" d="M38.5 20c-3-4-7-6.5-12-7.5 3.5 2 5.6 4.3 6.8 7.2z"/><path class="dk-head" d="M22.5 31l-7 .5 5.5 4.5M21 39.5l-7 1.5 6 3.5M19.6 48l-7 2 6.2 3"/><path class="dk-head" d="M56 30L53 26C48 24 44 22 40 21L36 19C28 12 20 9 11 8C18 12 24 17 29 23C25 27 22 32 21 38C20 45 19 51 17 58L35 58C35 50 37 44 41 40L50 38L53.5 36L46 34L56 31Z"/><path class="dk-eye" d="M39 26.5c1.6-1.6 3.6-1.6 5 0-1.4 1.2-3.4 1.2-5 0z"/><circle cx="52" cy="28.4" r=".8" class="dk-eye"/><path class="dk-line" d="M47.5 34.6l1 1.7 1.1-1.9M50.8 33.8l.9 1.5 1-1.7M28 44c3-2 6-2.6 9-2.4M26 51c3-1.6 6-2 9-1.8"/></g></svg></span> <span class="brand-name">Dragonbane</span></span>
      <span class="spacer"></span>
      <span id="sync-status" class="status-pill local" title="Data storage mode">Local</span>
      <button id="theme-toggle" class="icon-btn" title="Theme" aria-label="Theme">☾</button>
    </header>

    <main id="screen" class="app-main">
      <!-- Screens are rendered here by app.js -->
      <div class="boot-splash" aria-hidden="true"><svg class="drake" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="29" class="dk-ring"/><g transform="translate(3 1) scale(.92)"><path class="dk-head" d="M38.5 20c-3-4-7-6.5-12-7.5 3.5 2 5.6 4.3 6.8 7.2z"/><path class="dk-head" d="M22.5 31l-7 .5 5.5 4.5M21 39.5l-7 1.5 6 3.5M19.6 48l-7 2 6.2 3"/><path class="dk-head" d="M56 30L53 26C48 24 44 22 40 21L36 19C28 12 20 9 11 8C18 12 24 17 29 23C25 27 22 32 21 38C20 45 19 51 17 58L35 58C35 50 37 44 41 40L50 38L53.5 36L46 34L56 31Z"/><path class="dk-eye" d="M39 26.5c1.6-1.6 3.6-1.6 5 0-1.4 1.2-3.4 1.2-5 0z"/><circle cx="52" cy="28.4" r=".8" class="dk-eye"/><path class="dk-line" d="M47.5 34.6l1 1.7 1.1-1.9M50.8 33.8l.9 1.5 1-1.7M28 44c3-2 6-2.6 9-2.4M26 51c3-1.6 6-2 9-1.8"/></g></svg><span class="boot-rule"></span></div>
    </main>

    <nav class="app-nav" id="app-nav" aria-label="Main">
      <button data-route="home" class="active" aria-current="page"><span class="ico" aria-hidden="true">⚔</span>Hero</button>
      <button data-route="party"><span class="ico" aria-hidden="true">🛡</span>Fight</button>
      <button id="ctx-action" class="ctx-action" type="button" aria-label="Next action"></button>
      <button data-route="story"><span class="ico" aria-hidden="true">📜</span>Story</button>
      <button data-route="book"><span class="ico" aria-hidden="true">📖</span>Book</button>
    </nav>
  </div>

  <!-- Rules library (global DRAGONBANE) must load before the app -->
  <script src="data.js"></script>
  <script src="data-magic.js"></script>
  <script src="data-pregens.js"></script>
  <script src="data-solo.js"></script>
  <script src="data-monsters.js"></script>
  <script src="data-npcs.js"></script>

  <!-- Firebase 10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="firebase-config.js"></script>
  <!-- App logic, split into ES modules (see CLAUDE.md §5). main.js is the entry point. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
